plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
    outputs.upToDateWhen { false }
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    clear()
    maven {
        url = 'https://maven.gtodyssey.com/releases'
    }
    maven {
        name = "NeoForge CDN Mirror"
        url = "https://neoforged.forgecdn.net/releases"
    }
    maven {
        name = "Mojang Meta Mirror"
        url = "https://neoforged.forgecdn.net/mojang-meta"
    }
    maven {
        name = "Minecraft Libraries"
        url = "https://libraries.minecraft.net/"
    }
    maven {
        name = "Aliyun Public"
        url = "https://maven.aliyun.com/repository/public/"
    }
    mavenCentral()
    maven {
        name = "NeoForge Official (Fallback)"
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = 'HowXu'
        url = 'https://maven.howxu.cn/'
        content {
            excludeGroup 'mezz.jei'
        }
    }
    maven {
        name = "Latvian (KubeJS/Rhino)"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.rtyley"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {

    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

configurations.configureEach {
    exclude group: 'mezz.jei', module: 'jei-26.1.2-neoforge-api'
    exclude group: 'mezz.jei', module: 'jei-26.1.2-neoforge'
}

dependencies {
    implementation "curse.maven:jade-324717:8651070"
    implementation "curse.maven:jei-238222:8837431"
    implementation "curse.maven:registrylib-1486427:8525072"
    implementation "curse.maven:applied-energistics-2-223794:8257570"
    implementation "curse.maven:ctm-lib-1568397:8876523"
    compileOnly 'org.appliedenergistics:guideme:26.1.11-beta:api'
    runtimeOnly 'org.appliedenergistics:guideme:26.1.11-beta'
    compileOnly "cn.howxu:ModularMachinery-Community-Refoxed:0.0.2+efa2122d:api"
    runtimeOnly "cn.howxu:ModularMachinery-Community-Refoxed:0.0.2+efa2122d"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {

    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
